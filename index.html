<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Парсер Яндекс Карт</title>
  <meta name="description" content="Простая заглушка проекта parser-for-yandex-maps.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #607085;
      --accent: #e23d28;
      --line: #dbe3ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        linear-gradient(120deg, rgba(226, 61, 40, 0.09), transparent 34%),
        linear-gradient(240deg, rgba(37, 99, 235, 0.08), transparent 30%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: clamp(28px, 6vw, 56px);
      box-shadow: 0 24px 70px rgba(31, 41, 55, 0.12);
    }

    .label {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 68px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    p {
      margin: 22px 0 0;
      max-width: 560px;
      color: var(--muted);
      font-size: clamp(17px, 2.7vw, 20px);
      line-height: 1.55;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 34px;
    }

    .status span {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #334155;
      font-size: 14px;
      background: #f8fafc;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">parser-for-yandex-maps</p>
    <h1>Парсер Яндекс Карт</h1>
    <p>Сайт проекта готовится к запуску. Здесь появится интерфейс для работы с данными Яндекс Карт.</p>
    <div class="status" aria-label="Статус проекта">
      <span>GitHub Pages</span>
      <span>Заглушка сайта</span>
      <span>ya-maps-parser</span>
    </div>
  </main>
</body>
</html>
